<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CarPlay 车机桌面 · 交互原型</title>
<!--
  设计方向：CarPlay 真机保真 —— 纯黑画布、SF/苹方字体、克制动效；
  设置页沿用 iOS「设置」列表气质（深色分组行 + 蓝色勾选）。
  画布按真机流规格 1160×540（奥迪 MIB3），dock 为左侧 126px 独立屏。
  交互：点「车机设置」→ 双栏设置页；勾选应用 → 实时出现在桌面；Esc / ⌂ 返回。
-->
<style>
:root{
  --w: 1160px; --h: 540px; --dock-w: 126px;
  --text: #F5F5F7;
  --dim: #8E8E93;
  --dim-2: #636366;
  --sep: #1E1E21;
  --row: #121215;
  --row-hover: #1B1B1F;
  --row-active: #1C1C1F;
  --accent: #0A84FF;          /* iOS 蓝：勾选框 */
  --green: #34C759;           /* 电量 */
  --ease-out: cubic-bezier(.22,.61,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; min-height:100vh; background:#0B0B0D; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
}
.caption{ color:#5A5A5F; font-size:12.5px; letter-spacing:.02em; display:flex; align-items:center; gap:8px; }
.caption b{ color:#8E8E93; font-weight:600; }
.caption kbd{
  font:inherit; font-size:11.5px; color:#9A9AA0; background:#1A1A1E;
  border:1px solid #2A2A2F; border-radius:5px; padding:1px 6px;
}

/* ===================== 屏幕画布 ===================== */
.stage{
  position:relative; width:var(--w); height:var(--h);
  background:#000; border-radius:22px; overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.65), 0 0 0 1px #1E1E22;
  display:flex;
}

/* ===================== 左侧 dock（独立虚拟屏） ===================== */
.dock{
  flex:0 0 var(--dock-w); width:var(--dock-w);
  display:flex; flex-direction:column; align-items:center;
  padding:12px 8px 12px; gap:4px;
  border-right:1px solid var(--sep);
}
.dock-clock{
  font-size:22px; font-weight:600; letter-spacing:.03em; line-height:1.05;
  font-variant-numeric:tabular-nums; color:#fff;
}
.dock-batt{
  display:flex; flex-direction:column; align-items:center; gap:5px; margin-top:6px;
  color:#B0B0B8; font-size:11px; font-weight:500; font-variant-numeric:tabular-nums;
}
.dock-batt .bar{ width:46px; height:4px; border-radius:2.5px; background:#2C2C2E; overflow:hidden; }
.dock-batt .bar i{ display:block; height:100%; width:88%; background:var(--green); border-radius:3px; }
.dock-apps{
  flex:1; width:100%; display:flex; flex-direction:column; align-items:center;
  gap:16px; padding-top:22px; overflow-y:auto; scrollbar-width:none;
}
.dock-apps::-webkit-scrollbar{ display:none; }
.dock-apps .app-icon{ width:66px; height:66px; border-radius:17px; cursor:pointer; transition:transform .16s var(--ease-out); }
.dock-apps .app-icon:active{ transform:scale(.92); }
.dock-divider{ width:100%; height:1px; background:var(--sep); }
.dock-home{
  width:100%; padding:12px 0 8px; display:flex; align-items:center; justify-content:center;
  border:0; background:none; cursor:pointer; color:#fff;
  opacity:.94; transition:opacity .15s, transform .15s var(--ease-out);
}
.dock-home svg{ width:40px; height:40px; }
.dock-home:active{ transform:scale(.88); opacity:1; }

/* ===================== 应用区（两块屏叠放：桌面 / 设置） ===================== */
.app-area{ position:relative; flex:1; overflow:hidden; }
.screen{ position:absolute; inset:0; }

/* ---- 桌面 ---- */
#desktopScreen{ transition:transform .3s var(--ease-out), opacity .3s var(--ease-out); }
#desktopScreen.pushed{ transform:translateX(-30px); opacity:.2; pointer-events:none; }
.grid-pages{
  height:100%; display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.grid-pages::-webkit-scrollbar{ display:none; }
.page{
  flex:0 0 100%; scroll-snap-align:start;
  display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr);
  padding:14px 14px 54px; gap:2px;
}
.cell{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  border:0; background:none; color:inherit; font:inherit; cursor:pointer;
  border-radius:20px; transition:transform .16s var(--ease-out);
  animation:cellIn .34s var(--ease-out) both; animation-delay:calc(var(--i,0) * 26ms);
}
.cell:active{ transform:scale(.92); }
@keyframes cellIn{ from{ opacity:0; transform:scale(.86) translateY(6px); } to{ opacity:1; transform:none; } }
.cell .app-icon{ width:86px; height:86px; border-radius:21px; }
.cell .label{
  max-width:96%; padding:2px 9px 2.5px; border-radius:7px;
  background:rgba(255,255,255,.93); color:#0B0B0D;
  font-size:13px; font-weight:600; letter-spacing:.01em; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dots{
  position:absolute; left:0; right:0; bottom:16px;
  display:flex; justify-content:center; gap:8px; pointer-events:none;
}
.dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.32); transition:background .2s; }
.dot.active{ background:#fff; }

/* ---- 通用应用图标（squircle + 白色图形） ---- */
.app-icon{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  overflow:hidden; border-radius:22%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 5px 14px rgba(0,0,0,.5);
}
.app-icon svg{ width:76%; height:76%; display:block; }

/* ---- 车机设置（双栏） ---- */
#settingsScreen{
  display:flex; background:#000;
  transform:translateX(46px); opacity:0; pointer-events:none;
  transition:transform .3s var(--ease-out), opacity .3s var(--ease-out);
}
#settingsScreen.open{ transform:none; opacity:1; pointer-events:auto; }

.settings-menu{
  flex:0 0 262px; display:flex; flex-direction:column; gap:2px;
  padding:12px 12px 14px; border-right:1px solid var(--sep);
}
.back-btn{
  align-self:flex-start; display:flex; align-items:center; gap:5px;
  border:0; background:none; cursor:pointer; color:var(--accent);
  font-size:14.5px; font-weight:500; padding:7px 10px 7px 4px; border-radius:10px;
  transition:background .15s;
}
.back-btn:active{ background:var(--row-active); }
.back-btn svg{ width:15px; height:15px; }
.menu-title{
  margin:16px 10px 8px; font-size:12px; font-weight:700; letter-spacing:.14em;
  color:var(--dim-2);
}
.menu-item{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  border:0; cursor:pointer; border-radius:12px; padding:11px 11px;
  background:none; color:var(--dim); font-size:15px; font-weight:500;
  transition:background .15s, color .15s;
}
.menu-item .mi-icon{
  width:29px; height:29px; border-radius:8.5px; display:flex; align-items:center; justify-content:center;
  background:#2C2C2E; flex:0 0 auto; transition:background .15s;
}
.menu-item .mi-icon svg{ width:17px; height:17px; }
.menu-item.active{ background:var(--row-active); color:var(--text); }
.menu-item.active .mi-icon{ background:var(--accent); }

.settings-content{ flex:1; min-width:0; display:flex; flex-direction:column; padding:18px 24px 12px; }
.content-head{ display:flex; align-items:baseline; gap:12px; }
.content-head h2{ margin:0; font-size:20px; font-weight:700; letter-spacing:.01em; }
.content-head .count{ color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
.content-sub{ margin:7px 0 14px; color:var(--dim); font-size:13px; }
.app-list{
  flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr;
  gap:10px; align-content:start; padding:2px 6px 8px 2px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 16px),transparent);
}
.app-list::-webkit-scrollbar{ width:8px; }
.app-list::-webkit-scrollbar-thumb{ background:#2A2A2E; border-radius:4px; }
.app-list::-webkit-scrollbar-track{ background:transparent; }
.app-row{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  border:0; cursor:pointer; border-radius:13px; padding:10px 12px;
  background:var(--row); color:inherit; font:inherit;
  transition:background .15s, transform .12s var(--ease-out);
}
.app-row:active{ transform:scale(.985); }
.app-row:hover{ background:var(--row-hover); }
.app-row .app-icon{ width:38px; height:38px; border-radius:10px; }
.app-row .name{ flex:1; min-width:0; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cb{
  width:25px; height:25px; border-radius:8px; flex:0 0 auto;
  border:2px solid #48484A;
  display:flex; align-items:center; justify-content:center;
  transition:background .18s, border-color .18s, transform .2s var(--ease-spring);
}
.cb svg{ width:13px; height:13px; }
.cb path{
  fill:none; stroke:#fff; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .16s ease .04s;
}
.app-row.checked .cb{ background:var(--accent); border-color:var(--accent); transform:scale(1.06); }
.app-row.checked .cb path{ stroke-dashoffset:0; }

/* ---- 轻提示 ---- */
.toast{
  position:absolute; left:50%; bottom:56px; transform:translate(-50%, 8px);
  background:rgba(28,28,31,.94); color:#E5E5EA; font-size:13.5px;
  padding:9px 16px; border-radius:10px; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s var(--ease-out);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<div class="caption"><b>CarPlay 车机桌面 · 交互原型</b> · 1160 × 540 · 奥迪 MIB3 投屏画布</div>

  <div class="dock">
    <div class="dock-clock" id="clock">20:26</div>
    <div class="dock-batt"><span>⚡88%</span><div class="bar"><i></i></div></div>
    <div class="dock-apps" id="dockApps"></div>
    <div class="dock-divider"></div>
    <button class="dock-home" id="dockHome" title="回到桌面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 11.2 12 4.2l8.5 7"/>
        <path d="M5.6 9.6V19a1.6 1.6 0 0 0 1.6 1.6h9.6A1.6 1.6 0 0 0 18.4 19V9.6"/>
        <path d="M9.6 20.6v-5.4h4.8v5.4"/>
      </svg>
    </button>
  </div>

  <div class="app-area">
    <!-- 桌面：4×3 分页网格 + 页点 -->
    <section class="screen" id="desktopScreen">
      <div class="grid-pages" id="gridPages"></div>
      <div class="dots" id="dots"></div>
    </section>

    <!-- 车机设置：双栏（左菜单 / 右内容） -->
    <section class="screen" id="settingsScreen">
      <div class="settings-menu">
        <button class="back-btn" id="backBtn">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          桌面
        </button>
        <div class="menu-title">车机设置</div>
        <button class="menu-item active">
          <span class="mi-icon" id="menuIconGrid"></span>
          管理桌面应用
        </button>
      </div>
      <div class="settings-content">
        <div class="content-head">
          <h2>管理桌面应用</h2>

        </div>
        <p class="content-sub">勾选的应用将显示在桌面；「车机设置」固定在第一格。</p>
        <div class="app-list" id="appList"></div>
      </div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
</div>

<div class="caption">点击「车机设置」进入设置页 · 勾选应用会实时出现在桌面 · <kbd>Esc</kbd> 返回桌面</div>

  { id:'clock',    name:'时钟' },
  { id:'bilibili', name:'哔哩哔哩' },
  { id:'browser',  name:'浏览器' },
  { id:'calc',     name:'计算器' },
];
/* 默认勾选：地图类（真机上按已安装的地图应用自动选中） */
const DEFAULT_SELECTED = ['amap', 'baidu'];
/* 固定第一位：车机设置（不可取消） */
const PINNED = { id:'settings', name:'车机设置', pinned:true };

let selected = new Set(DEFAULT_SELECTED);

const $ = (id) => document.getElementById(id);
const iconHTML = (id) => {
  const i = ICONS[id];
  return `<span class="app-icon" style="background:${i.bg}"><svg viewBox="0 0 64 64">${i.glyph}</svg></span>`;
};

/* ===================== dock ===================== */
let toastTimer = null;
function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
}

/* 时钟（无秒）：随分钟刷新 */
function tickClock(){
  const d = new Date();
  $('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tickClock();
setInterval(tickClock, 15000);

/* dock 运行中应用（原型示意：高德在运行） */
function renderDock(){
  const box = $('dockApps');
  box.innerHTML = '';
  [{ id:'amap', name:'高德地图' }].forEach(app => {
    const el = document.createElement('span');
    el.innerHTML = iconHTML(app.id);
    el.firstElementChild.title = app.name + '（运行中）';
    el.firstElementChild.onclick = () => toast(`切换回「${app.name}」（原型示意）`);
    box.appendChild(el.firstElementChild);
  });
}

/* ===================== 桌面网格 ===================== */
const PER_PAGE = 12;

function desktopEntries(){
  return [PINNED, ...APPS.filter(a => selected.has(a.id))];
}

function renderDesktop(){
  const pagesBox = $('gridPages');
  const entries = desktopEntries();
  const pages = [];
  for (let i = 0; i < entries.length; i += PER_PAGE) pages.push(entries.slice(i, i + PER_PAGE));
  if (pages.length === 0) pages.push([]);

  pagesBox.innerHTML = '';
  pages.forEach((page, pi) => {
    const pageEl = document.createElement('div');
    pageEl.className = 'page';
    page.forEach((entry, ci) => {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.style.setProperty('--i', ci + pi * 4);
      cell.innerHTML = iconHTML(entry.id) + `<span class="label">${entry.name}</span>`;
      cell.onclick = () => {
        if (entry.pinned) openSettings();
        else toast(`启动「${entry.name}」（原型示意）`);
      };
      pageEl.appendChild(cell);
    });
    pagesBox.appendChild(pageEl);
  });

  renderDots(pages.length);
  pagesBox.scrollLeft = 0;
  updateActiveDot(0);
}

function renderDots(count){
  const dots = $('dots');
  dots.innerHTML = '';
  if (count < 2) return;
  for (let i = 0; i < count; i++){
    const d = document.createElement('span');
    d.className = 'dot';
    dots.appendChild(d);
  }
}

function updateActiveDot(index){
  document.querySelectorAll('#dots .dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
}

$('gridPages').addEventListener('scroll', () => {
  const box = $('gridPages');
  const index = Math.round(box.scrollLeft / box.clientWidth);
  updateActiveDot(index);
}, { passive:true });

/* ===================== 设置页 ===================== */
function openSettings(){
  $('settingsScreen').classList.add('open');
  $('desktopScreen').classList.add('pushed');
}
function closeSettings(){
  $('settingsScreen').classList.remove('open');
  $('desktopScreen').classList.remove('pushed');
}

function renderAppList(){
  const list = $('appList');
  list.innerHTML = '';
  APPS.forEach(app => {
    const row = document.createElement('button');
    row.className = 'app-row' + (selected.has(app.id) ? ' checked' : '');
    row.setAttribute('role', 'checkbox');
    row.setAttribute('aria-checked', selected.has(app.id) ? 'true' : 'false');
    row.innerHTML = iconHTML(app.id) +
      `<span class="name">${app.name}</span>` +
      `<span class="cb"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></svg></span>`;
    row.onclick = () => {
      if (selected.has(app.id)){
        selected.delete(app.id);
        toast(`「${app.name}」已从桌面移除`);
      } else {
        selected.add(app.id);
        toast(`「${app.name}」已显示到桌面`);
      }
      row.classList.toggle('checked', selected.has(app.id));
      row.setAttribute('aria-checked', selected.has(app.id) ? 'true' : 'false');
      updateCount();
      renderDesktop();
    };
    list.appendChild(row);
  });
  updateCount();
}

function updateCount(){
  $('selectedCount').textContent = `已选 ${selected.size} 个`;
}

/* ===================== 接线 ===================== */
$('backBtn').onclick = closeSettings;
$('dockHome').onclick = () => { closeSettings(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

$('menuIconGrid').innerHTML = `<svg viewBox="0 0 64 64">${ICONS.grid.glyph}</svg>`;

renderDock();
renderDesktop();
renderAppList();

/* 截图/直达：?view=settings 直接打开设置页 */
if (new URLSearchParams(location.search).get('view') === 'settings'){
  openSettings();
}
</script>
</body>
</html>
